appId: com.a1exalexander.mysticals
productName: Mysticals
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
mac:
  category: public.app-category.productivity
  icon: build/icon.png
  # Used by the zip target (dmg sets its own). The in-app updater looks for the -${arch}-mac.zip asset.
  artifactName: ${productName}-${version}-${arch}-mac.${ext}
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Release CI signs with the Developer ID certificate from CSC_LINK and notarizes with APPLE_ID /
  # APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID (see release.yml). Without them, local builds are unsigned.
  # Hardened runtime is required for notarization; electron-builder adds Electron's default entitlements.
  hardenedRuntime: true
dmg:
  artifactName: ${productName}-${version}-${arch}.dmg
# Unsigned too: SmartScreen shows "More info → Run anyway" on first launch.
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  # Default comes from the scoped package name (@mysticals/desktop), which is not a valid file name.
  executableName: mysticals
  icon: build/icon.png
  category: Office
  # Required by the deb target.
  maintainer: Oleksandr Ratushnyi <forcewizu@gmail.com>
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
deb:
  # Default is productName ("Mysticals"); Debian package names must be lowercase.
  packageName: mysticals
